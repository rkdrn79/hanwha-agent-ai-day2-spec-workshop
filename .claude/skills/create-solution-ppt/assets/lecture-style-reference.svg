<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870">
  <rect width="1600" height="870" fill="#EEF1F5"/>
  <text x="64" y="58" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#202733">강연 슬라이드의 시각 문법</text>
  <text x="64" y="91" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#687384">내용은 자리표시자입니다 · 색·여백·증거 배치만 참고하세요</text>

  <!-- 01 cover -->
  <g transform="translate(64 130)">
    <rect width="444" height="250" rx="3" fill="#F37321"/>
    <path d="M330 0H444V250H360V184L330 154Z" fill="#F9D2A3"/>
    <path d="M350 250L381 218L412 250Z" fill="#F37321"/>
    <rect x="26" y="24" width="84" height="25" rx="4" fill="#F9D2A3"/>
    <text x="68" y="42" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#7A3B0A">PROJECT</text>
    <text x="27" y="88" font-family="Arial" font-size="12" fill="#FFFFFF">IMPLEMENTATION BRIEF</text>
    <text x="27" y="121" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">근거로 설명하는</text>
    <text x="27" y="153" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">구현 결과</text>
    <text x="27" y="190" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="11" fill="#FFF5ED">문제 · 결정 · 동작 · 검증</text>
  </g>
  <text x="64" y="410" font-family="Arial" font-size="14" font-weight="700" fill="#515A68">01 · COVER</text>

  <!-- 02 section -->
  <g transform="translate(578 130)">
    <rect width="444" height="250" rx="3" fill="#F37321"/>
    <text x="35" y="94" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">01.</text>
    <text x="86" y="94" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">문제와 결정</text>
    <text x="35" y="130" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#FFF5ED">한 장에는 하나의 전환만 보여줍니다</text>
    <line x1="35" y1="174" x2="335" y2="174" stroke="#F9D2A3" stroke-width="2"/>
  </g>
  <text x="578" y="410" font-family="Arial" font-size="14" font-weight="700" fill="#515A68">02 · SECTION</text>

  <!-- 03 flow -->
  <g transform="translate(1092 130)">
    <rect width="444" height="250" rx="3" fill="#FFFFFF"/>
    <rect width="444" height="24" fill="#F37321"/>
    <text x="18" y="17" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">결정이 동작으로 이어지는 과정</text>
    <text x="22" y="59" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#202733">한 방향으로 읽히는 흐름</text>
    <g transform="translate(22 89)" font-family="Arial" font-size="10" text-anchor="middle">
      <rect width="82" height="68" rx="4" fill="#EEF3FF" stroke="#2956D7"/>
      <text x="41" y="39" fill="#003380" font-weight="700">SOURCE</text>
      <path d="M86 34H102" stroke="#F37321" stroke-width="2"/><path d="M99 30L105 34L99 38" fill="none" stroke="#F37321" stroke-width="2"/>
      <rect x="108" width="82" height="68" rx="4" fill="#FFFFFF" stroke="#2956D7"/>
      <text x="149" y="39" fill="#003380" font-weight="700">DECIDE</text>
      <path d="M194 34H210" stroke="#F37321" stroke-width="2"/><path d="M207 30L213 34L207 38" fill="none" stroke="#F37321" stroke-width="2"/>
      <rect x="216" width="82" height="68" rx="4" fill="#FFFFFF" stroke="#2956D7"/>
      <text x="257" y="39" fill="#003380" font-weight="700">RUN</text>
      <path d="M302 34H318" stroke="#F37321" stroke-width="2"/><path d="M315 30L321 34L315 38" fill="none" stroke="#F37321" stroke-width="2"/>
      <rect x="324" width="82" height="68" rx="4" fill="#FFF1E8" stroke="#D74A11"/>
      <text x="365" y="39" fill="#D74A11" font-weight="700">VERIFY</text>
    </g>
    <text x="22" y="205" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="10" fill="#7B8491">실제 상태와 테스트를 화살표 위에 올립니다</text>
  </g>
  <text x="1092" y="410" font-family="Arial" font-size="14" font-weight="700" fill="#515A68">03 · FLOW</text>

  <!-- 04 table -->
  <g transform="translate(64 500)">
    <rect width="444" height="250" rx="3" fill="#FFFFFF"/>
    <rect width="444" height="24" fill="#F37321"/>
    <text x="18" y="17" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">근거가 결론을 지지하는 방식</text>
    <text x="22" y="58" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#202733">파일과 검증을 짧은 표로 연결</text>
    <g transform="translate(22 82)" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="10">
      <rect width="400" height="29" fill="#003380"/>
      <text x="14" y="19" fill="#FFFFFF" font-weight="700">근거</text><text x="135" y="19" fill="#FFFFFF" font-weight="700">결정</text><text x="292" y="19" fill="#FFFFFF" font-weight="700">검증</text>
      <rect y="29" width="400" height="31" fill="#FFFFFF" stroke="#D8DEE8"/><text x="14" y="49" fill="#202733">SPEC</text><text x="135" y="49" fill="#202733">업무 규칙</text><text x="292" y="49" fill="#202733">AC 시나리오</text>
      <rect y="60" width="400" height="31" fill="#F5F7FA" stroke="#D8DEE8"/><text x="14" y="80" fill="#202733">Architecture</text><text x="135" y="80" fill="#202733">상태 전이</text><text x="292" y="80" fill="#202733">구조 검사</text>
      <rect y="91" width="400" height="31" fill="#FFFFFF" stroke="#D8DEE8"/><text x="14" y="111" fill="#202733">Tests</text><text x="135" y="111" fill="#202733">완료 조건</text><text x="292" y="111" fill="#202733">자동 테스트</text>
    </g>
  </g>
  <text x="64" y="780" font-family="Arial" font-size="14" font-weight="700" fill="#515A68">04 · EVIDENCE TABLE</text>

  <!-- 05 code -->
  <g transform="translate(578 500)">
    <rect width="444" height="250" rx="3" fill="#FFFFFF"/>
    <rect width="444" height="24" fill="#F37321"/>
    <text x="18" y="17" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">실행 증거는 실제 화면처럼</text>
    <text x="22" y="58" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#202733">코드·명령은 어두운 한 면에 집중</text>
    <rect x="22" y="80" width="400" height="130" rx="5" fill="#1F2937"/>
    <g font-family="Menlo, Consolas, monospace" font-size="10">
      <text x="40" y="105" fill="#F9D2A3">$</text><text x="55" y="105" fill="#FFFFFF">read docs · tests · changelog</text>
      <text x="40" y="130" fill="#F9D2A3">1</text><text x="55" y="130" fill="#D8DEE8">claim → source → decision</text>
      <text x="40" y="155" fill="#F9D2A3">2</text><text x="55" y="155" fill="#D8DEE8">state → behavior → evidence</text>
      <text x="40" y="180" fill="#F9D2A3">✓</text><text x="55" y="180" fill="#A7F3D0">tests passed</text>
    </g>
  </g>
  <text x="578" y="780" font-family="Arial" font-size="14" font-weight="700" fill="#515A68">05 · CODE / PROOF</text>

  <!-- 06 comparison -->
  <g transform="translate(1092 500)">
    <rect width="444" height="250" rx="3" fill="#FFFFFF"/>
    <rect width="444" height="24" fill="#F37321"/>
    <text x="18" y="17" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">결론과 질문은 색의 역할을 나눕니다</text>
    <text x="22" y="58" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#202733">확정 근거와 남은 판단을 분리</text>
    <rect x="22" y="83" width="190" height="105" rx="4" fill="#EEF3FF" stroke="#2956D7"/>
    <text x="39" y="108" font-family="Arial" font-size="11" font-weight="700" fill="#003380">CONFIRMED</text>
    <text x="39" y="139" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#202733">원본 위치와 테스트가</text>
    <text x="39" y="158" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#202733">연결된 결론</text>
    <rect x="232" y="83" width="190" height="105" rx="4" fill="#FFF1E8" stroke="#D74A11"/>
    <text x="249" y="108" font-family="Arial" font-size="11" font-weight="700" fill="#D74A11">OPEN</text>
    <text x="249" y="139" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#202733">사람이 결정해야 하는</text>
    <text x="249" y="158" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#202733">질문과 영향</text>
  </g>
  <text x="1092" y="780" font-family="Arial" font-size="14" font-weight="700" fill="#515A68">06 · COMPARISON</text>

  <text x="64" y="838" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#7B8491">권장 리듬: 표지 → 문제 → 결정 → 동작 → 상태 → 근거 → 검증 → 결론</text>
</svg>

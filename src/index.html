<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>IPS WBS 출고·취소 MVP</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #66717e;
      --line: #dfe4e8;
      --panel: #ffffff;
      --bg: #f4f6f8;
      --orange: #f37321;
      --orange-dark: #d9560b;
      --navy: #172a3a;
      --green: #17795d;
      --red: #b83a3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: var(--navy);
      color: white;
      padding: 26px max(24px, calc((100vw - 1180px) / 2));
      border-bottom: 5px solid var(--orange);
    }
    header p { margin: 8px 0 0; color: #cbd4db; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); }
    main { max-width: 1180px; margin: 26px auto 60px; padding: 0 20px; }
    .flow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .flow div {
      padding: 13px 16px;
      background: #fff5ee;
      border: 1px solid #ffd5bc;
      border-radius: 10px;
      font-weight: 700;
      color: #8f3b09;
    }
    .flow span { color: var(--orange); margin-right: 8px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 7px 24px rgba(23, 42, 58, .06);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font-size: 19px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; }
    th { background: #f8fafb; color: #4d5965; font-size: 13px; }
    td { font-size: 14px; }
    tr:last-child td { border-bottom: 0; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .primary { color: white; background: var(--orange); }
    .primary:hover { background: var(--orange-dark); }
    .secondary { color: var(--navy); background: #e8edf1; }
    .danger { color: white; background: var(--red); }
    form {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 20px;
    }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    input {
      width: 100%;
      border: 1px solid #cbd2d8;
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      background: white;
    }
    input[readonly] { background: #f3f5f6; color: #55616c; }
    .form-actions { display: flex; align-items: end; }
    .form-actions button { width: 100%; min-height: 40px; }
    .message {
      display: none;
      margin: 0 20px 20px;
      padding: 12px 14px;
      border-radius: 8px;
      font-weight: 700;
    }
    .message.show { display: block; }
    .message.ok { color: #0f6048; background: #e8f6f1; }
    .message.error { color: #942e2e; background: #fdecec; }
    .status { display: inline-block; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 800; }
    .completed { color: #0f6048; background: #dff3eb; }
    .canceled { color: #6f7780; background: #eceff1; }
    .empty { color: var(--muted); text-align: center; padding: 26px; }
    @media (max-width: 820px) {
      .flow { grid-template-columns: 1fr; }
      form { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 520px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>IPS WBS 출고·취소 MVP</h1>
    <p>재고를 선택해 출고하고, 완료 건을 전체 취소해 재고 원복을 확인합니다.</p>
  </header>
  <main>
    <section class="flow" aria-label="업무 흐름">
      <div><span>01</span>재고 선택</div>
      <div><span>02</span>출고·재고 차감</div>
      <div><span>03</span>전체 취소·재고 원복</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>재고 현황</h2>
        <button class="secondary" id="resetButton" type="button">데모 초기화</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>자재</th><th>플랜트</th><th>저장위치</th><th>WBS</th><th>가용 재고</th><th></th></tr></thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>출고 처리</h2></div>
      <form id="shipmentForm">
        <label>출고 요청 번호<input id="requestId" required value="GI-001"></label>
        <label>처리자<input id="userId" required value="H0001"></label>
        <label>자재코드<input id="materialCode" required readonly></label>
        <label>플랜트<input id="plant" required readonly></label>
        <label>저장위치<input id="storageLocation" required readonly></label>
        <label>WBS<input id="wbs" required readonly></label>
        <label>출고 수량<input id="quantity" type="number" min="1" required value="1"></label>
        <div class="form-actions"><button class="primary" type="submit">출고 처리</button></div>
      </form>
      <p class="message" id="message" role="status"></p>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>출고 이력</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>요청 번호</th><th>자재 / WBS</th><th>수량</th><th>이동유형</th><th>상태</th><th></th></tr></thead>
          <tbody id="shipmentBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const byId = (id) => document.getElementById(id);
    const fields = ["materialCode", "plant", "storageLocation", "wbs"];

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    function showMessage(text, kind) {
      const message = byId("message");
      message.textContent = text;
      message.className = `message show ${kind}`;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "요청 처리에 실패했습니다.");
      return data;
    }

    async function loadInventory() {
      const { inventory } = await api("/api/inventory");
      const body = byId("inventoryBody");
      body.replaceChildren();
      inventory.forEach((item) => {
        const row = document.createElement("tr");
        row.append(
          cell(`${item.material_name} (${item.material_code})`),
          cell(item.plant),
          cell(item.storage_location),
          cell(item.wbs),
          cell(`${item.quantity} ${item.unit}`),
        );
        const actionCell = document.createElement("td");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary";
        button.textContent = "선택";
        button.addEventListener("click", () => {
          byId("materialCode").value = item.material_code;
          byId("plant").value = item.plant;
          byId("storageLocation").value = item.storage_location;
          byId("wbs").value = item.wbs;
          byId("quantity").focus();
        });
        actionCell.append(button);
        row.append(actionCell);
        body.append(row);
      });
    }

    async function loadShipments() {
      const { shipments } = await api("/api/shipments");
      const body = byId("shipmentBody");
      body.replaceChildren();
      if (!shipments.length) {
        const row = document.createElement("tr");
        const empty = cell("아직 처리된 출고가 없습니다.");
        empty.colSpan = 7;
        empty.className = "empty";
        row.append(empty);
        body.append(row);
        return;
      }
      shipments.forEach((shipment) => {
        const row = document.createElement("tr");
        row.append(
          cell(shipment.shipment_id),
          cell(shipment.request_id),
          cell(`${shipment.material_code} / ${shipment.wbs}`),
          cell(`${shipment.quantity} ${shipment.unit}`),
          cell(shipment.cancel_movement_type || shipment.movement_type),
        );
        const statusCell = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = `status ${shipment.status.toLowerCase()}`;
        badge.textContent = shipment.status === "COMPLETED" ? "출고 완료" : "취소 완료";
        statusCell.append(badge);
        row.append(statusCell);

        const actionCell = document.createElement("td");
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "danger";
        cancel.textContent = "전체 취소";
        cancel.disabled = shipment.status !== "COMPLETED";
        cancel.addEventListener("click", () => cancelShipment(shipment.shipment_id));
        actionCell.append(cancel);
        row.append(actionCell);
        body.append(row);
      });
    }

    async function refresh() {
      await Promise.all([loadInventory(), loadShipments()]);
    }

    async function cancelShipment(shipmentId) {
      try {
        const result = await api(`/api/shipments/${shipmentId}/cancel`, {
          method: "POST",
          body: JSON.stringify({ user_id: byId("userId").value }),
        });
        showMessage(`출고 #${shipmentId} 취소 완료 · 재고 ${result.stock_after}${result.unit}`, "ok");
        await refresh();
      } catch (error) { showMessage(error.message, "error"); }
    }

    byId("shipmentForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const payload = {
          request_id: byId("requestId").value,
          user_id: byId("userId").value,
          material_code: byId("materialCode").value,
          plant: byId("plant").value,
          storage_location: byId("storageLocation").value,
          wbs: byId("wbs").value,
          quantity: Number(byId("quantity").value),
        };
        const result = await api("/api/shipments", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        showMessage(`출고 완료 · 이동유형 ${result.movement_type} · 남은 재고 ${result.stock_after}${result.unit}`, "ok");
        byId("requestId").value = `GI-${String(result.shipment_id + 1).padStart(3, "0")}`;
        await refresh();
      } catch (error) { showMessage(error.message, "error"); }
    });

    byId("resetButton").addEventListener("click", async () => {
      await api("/api/demo/reset", { method: "POST", body: "{}" });
      fields.forEach((id) => { byId(id).value = ""; });
      byId("requestId").value = "GI-001";
      showMessage("데모 데이터를 초기 상태로 되돌렸습니다.", "ok");
      await refresh();
    });

    refresh().catch((error) => showMessage(error.message, "error"));
  </script>
</body>
</html>

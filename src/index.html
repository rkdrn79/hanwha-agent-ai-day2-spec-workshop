<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <title>IPS WBS 출고·취소 MVP</title>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">HANWHA AGENT AI WORKSHOP</p>
    <h1>IPS WBS 출고·취소</h1>
    <p>재고를 선택해 출고하고, 완료 건을 전체 취소합니다.</p>
  </header>

  <main>
    <section class="workflow" aria-label="업무 흐름">
      <span>01 재고 선택</span>
      <span>02 출고·차감</span>
      <span>03 전체 취소·원복</span>
    </section>

    <section class="panel" aria-labelledby="inventoryTitle">
      <div class="panel-header">
        <div>
          <p class="section-label">INVENTORY</p>
          <h2 id="inventoryTitle">재고 현황</h2>
        </div>
        <div class="toolbar">
          <label for="wbsFilter">WBS 필터</label>
          <input id="wbsFilter" placeholder="예: IM24-001">
          <button id="filterButton" type="button">조회</button>
          <button id="resetButton" type="button">데모 초기화</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>자재</th><th>플랜트</th><th>저장위치</th><th>WBS</th><th>가용 재고</th><th>선택</th></tr>
          </thead>
          <tbody id="inventoryBody">
            <tr><td colspan="6" class="empty">프론트엔드 Agent가 재고 조회를 구현합니다.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" aria-labelledby="outboundTitle">
      <div class="panel-header">
        <div>
          <p class="section-label">OUTBOUND</p>
          <h2 id="outboundTitle">출고 처리</h2>
        </div>
      </div>
      <form id="shipmentForm">
        <label>출고 요청 번호<input id="requestId" required value="GI-001"></label>
        <label>처리자<input id="userId" required value="H0001"></label>
        <label>자재코드<input id="materialCode" required readonly></label>
        <label>플랜트<input id="plant" required readonly></label>
        <label>저장위치<input id="storageLocation" required readonly></label>
        <label>WBS<input id="wbs" required readonly></label>
        <label>출고 수량<input id="quantity" type="number" min="1" required value="1"></label>
        <button id="submitButton" type="submit">출고 처리</button>
      </form>
      <p class="message" id="message" role="status">아직 Frontend 상태·API 연동이 구현되지 않았습니다.</p>
    </section>

    <section class="panel" aria-labelledby="historyTitle">
      <div class="panel-header">
        <div>
          <p class="section-label">HISTORY</p>
          <h2 id="historyTitle">출고 이력</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>요청 번호</th><th>자재 / WBS</th><th>수량</th><th>이동유형</th><th>상태</th><th>작업</th></tr>
          </thead>
          <tbody id="shipmentBody">
            <tr><td colspan="7" class="empty">아직 처리된 출고가 없습니다.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>

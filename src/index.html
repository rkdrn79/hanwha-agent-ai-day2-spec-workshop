<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사내추첨 MVP</title>
  <style>
    :root {
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
      color: #17202a;
      background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(860px, calc(100% - 32px)); margin: 44px auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); }
    h2 { margin: 0 0 16px; font-size: 21px; }
    p { line-height: 1.6; }
    .subtitle { margin: 0; color: #66717d; }
    .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; align-items: start; }
    .card { background: white; border-radius: 18px; padding: 24px; box-shadow: 0 12px 36px #17202a12; }
    label { display: block; margin: 16px 0 8px; font-weight: 750; }
    textarea, input {
      width: 100%; border: 1px solid #c8d0d8; border-radius: 10px;
      padding: 12px; font: inherit; color: inherit; background: white;
    }
    textarea { min-height: 230px; resize: vertical; line-height: 1.55; }
    button {
      width: 100%; border: 0; border-radius: 10px; padding: 14px 16px;
      margin-top: 18px; background: #f37321; color: white; font: inherit;
      font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { margin: 8px 0 0; color: #66717d; font-size: 13px; }
    .summary { color: #59636e; }
    .error { padding: 14px; border-radius: 10px; background: #fff0f0; color: #a42020; }
    .winner-list { list-style: none; padding: 0; display: grid; gap: 10px; }
    .winner { padding: 16px; border: 1px solid #ffd4b5; border-radius: 12px; background: #fff7f0; font-weight: 800; text-align: center; }
    .history { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .history li { padding: 12px; border: 1px solid #e2e6ea; border-radius: 10px; }
    .history strong { display: block; margin-bottom: 5px; }
    .empty { color: #77818b; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>사내추첨 MVP</h1>
      <p class="subtitle">스펙 작성 → AI 생성 → 검증 → 수정 실습용 토이 프로젝트</p>
    </header>

    <div class="grid">
      <section class="card">
        <h2>추첨 실행</h2>
        <form id="draw-form">
          <label for="participants">참여자</label>
          <textarea id="participants" aria-describedby="participant-hint">김한화
이태양
박도전
최미래
정성장</textarea>
          <p id="participant-hint" class="hint">한 줄에 한 명씩 입력합니다. 완전히 같은 이름은 한 번만 참여합니다.</p>

          <label for="winner-count">당첨자 수</label>
          <input id="winner-count" type="number" min="1" value="2">

          <button id="draw-button" type="submit">추첨하기</button>
        </form>
        <div id="result" aria-live="polite"></div>
      </section>

      <aside class="card">
        <h2>최근 실행 이력</h2>
        <div id="history" aria-live="polite"><p class="empty">아직 추첨 이력이 없습니다.</p></div>
      </aside>
    </div>
  </main>

  <script>
    const form = document.querySelector("#draw-form");
    const button = document.querySelector("#draw-button");
    const result = document.querySelector("#result");
    const historyBox = document.querySelector("#history");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "요청을 처리하지 못했습니다.");
      return data;
    }

    function renderResult(data) {
      const winners = data.winners
        .map((name) => `<li class="winner">${escapeHtml(name)}</li>`)
        .join("");
      result.innerHTML = `
        <p class="summary">고유 참여자 ${data.participant_count}명 · 중복 제거 ${data.duplicate_count}건 · 당첨 ${data.winner_count}명</p>
        <ul class="winner-list">${winners}</ul>
      `;
    }

    async function loadHistory() {
      const data = await request("/api/history?limit=10");
      if (!data.draws.length) {
        historyBox.innerHTML = '<p class="empty">아직 추첨 이력이 없습니다.</p>';
        return;
      }
      const items = data.draws.map((draw) => `
        <li>
          <strong>#${draw.draw_id} · ${draw.winner_count}명 당첨</strong>
          <span>${draw.winners.map(escapeHtml).join(", ")}</span>
        </li>
      `).join("");
      historyBox.innerHTML = `<ul class="history">${items}</ul>`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.innerHTML = '<p class="summary">추첨 중...</p>';

      try {
        const data = await request("/api/draw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            participants: document.querySelector("#participants").value,
            winner_count: Number(document.querySelector("#winner-count").value)
          })
        });
        renderResult(data);
        await loadHistory();
      } catch (error) {
        result.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
      } finally {
        button.disabled = false;
      }
    });

    loadHistory().catch(() => {
      historyBox.innerHTML = '<p class="error">이력을 불러오지 못했습니다.</p>';
    });
  </script>
</body>
</html>
